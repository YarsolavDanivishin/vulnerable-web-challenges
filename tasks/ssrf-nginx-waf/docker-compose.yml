services:
  service:
    build: .
    expose:
      - "80"
    depends_on:
      - app
    networks:
      - ssrf_net
      - ctfd_frp_containers
    labels:
      - "owl.proxy=true"
      - "owl.proxy.port=80"
      - "owl.label.conntype=http"

  app:
    build:
      context: .
      dockerfile: App.Dockerfile
    environment:
      - "FLAG=${FLAG}"
    expose:
      - "8080"
    networks:
      - ssrf_net

networks:
  ssrf_net:
  ctfd_frp_containers: {external: true}
