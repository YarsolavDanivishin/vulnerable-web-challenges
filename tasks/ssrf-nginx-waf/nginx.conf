events {}

http {
    server {
        listen 80;

        # Deliberately incomplete WAF: textual checks are not URL validation.
        if ($arg_url ~* "localhost|127\\.0\\.0\\.1|::1|0\\.0\\.0\\.0") {
            return 403 "blocked by training WAF\\n";
        }

        location / {
            proxy_pass http://app:8080;
        }
    }
}
